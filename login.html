
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e5e5e3;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: #1a1a1a;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 0.75rem;
    }
    .brand-icon svg { width: 22px; height: 22px; }
    .brand h1 { font-size: 20px; font-weight: 500; color: #1a1a1a; margin-bottom: 4px; }
    .brand p { font-size: 14px; color: #888; }
    .social-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
    .social-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 9px 12px;
      border: 1px solid #e5e5e3;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      color: #1a1a1a;
      transition: background 0.15s;
      font-family: inherit;
    }
    .social-btn:hover { background: #f5f5f3; }
    .social-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
    .divider span { font-size: 12px; color: #aaa; white-space: nowrap; }
    .divider-line { flex: 1; height: 1px; background: #e5e5e3; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #e5e5e3;
      border-radius: 10px;
      background: #fff;
      color: #1a1a1a;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus { border-color: #aaa; box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }
    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 40px; }
    .pass-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: #aaa; display: flex; align-items: center;
    }
    .pass-toggle:hover { color: #555; }
    .pass-toggle svg { width: 16px; height: 16px; }
    .options-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .remember { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #555; cursor: pointer; }
    .remember input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; accent-color: #1a1a1a; }
    .forgot { font-size: 13px; color: #555; text-decoration: none; }
    .forgot:hover { color: #1a1a1a; text-decoration: underline; }
    .login-btn {
      width: 100%; padding: 10px;
      border: none; border-radius: 10px;
      background: #1a1a1a; color: #fff;
      font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      transition: opacity 0.15s, transform 0.1s;
    }
    .login-btn:hover { opacity: 0.85; }
    .login-btn:active { transform: scale(0.99); }
    .signup-row { text-align: center; margin-top: 1.25rem; font-size: 13px; color: #888; }
    .signup-row a { color: #1a1a1a; font-weight: 500; text-decoration: none; }
    .signup-row a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 22 22" fill="none">
          <rect x="3" y="3" width="7" height="7" rx="1.5" fill="white"/>
          <rect x="12" y="3" width="7" height="7" rx="1.5" fill="white" opacity="0.5"/>
          <rect x="3" y="12" width="7" height="7" rx="1.5" fill="white" opacity="0.5"/>
          <rect x="12" y="12" width="7" height="7" rx="1.5" fill="white"/>
        </svg>
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to your account to continue</p>
    </div>

    <div class="social-row">
      <button class="social-btn" onclick="socialLogin('google')">
        <svg viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>
      <button class="social-btn" onclick="socialLogin('github')">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        GitHub
      </button>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <span>or continue with email</span>
      <div class="divider-line"></div>
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pass-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <button class="pass-toggle" onclick="togglePass()" title="Show/hide password">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="options-row">
      <label class="remember">
        <input type="checkbox" id="remember" />
        Remember me
      </label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <button class="login-btn" onclick="handleLogin()">Sign in</button>

    <div class="signup-row">
      Don't have an account? <a href="#">Sign up</a>
    </div>
  </div>

  <script>
    function togglePass() {
      const inp = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" stroke="currentColor" stroke-width="1.8" fill="none"/><line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="1.8"/>';
      } else {
        inp.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      if (!email || !pass) {
        alert('Please enter your email and password.');
        return;
      }
      // TODO: Replace with your actual login API call
      console.log('Login:', { email, remember });
      alert('Login submitted! Connect this to your backend.');
    }

    function socialLogin(provider) {
      // TODO: Replace with your OAuth redirect
      alert('Connect ' + provider + ' OAuth here.');
    }
  </script>
</body>
</html>
